version: '3.8'

services:
  jaeger:
    image: jaegertracing/jaeger:2.14.1
    container_name: jaeger
    command: ["--config", "/etc/jaeger/jaeger-config.yaml"]
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC Ingestion
      - "4318:4318"   # OTLP HTTP Ingestion
      - "8889:8889"   # Internal Prometheus metrics scrape port
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./alert.rules.yaml:/etc/prometheus/alert.rules.yaml
    ports:
      - "9090:9090"
    networks:
      - observability
    depends_on:
      - jaeger

networks:
  observability:
    driver: bridge