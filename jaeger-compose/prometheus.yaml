# prometheus.yaml
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert.rules.yaml"

scrape_configs:
  - job_name: 'jaeger-span-metrics'
    static_configs:
      - targets: ['jaeger:8889']

    # DYNAMIC METRIC REWRITING SECTION
    metric_relabel_configs:
      # 1. Rename jaeger_calls to jaeger_calls_total
      - source_labels: [__name__]
        regex: 'jaeger_calls'
        target_label: __name__
        replacement: 'jaeger_calls_total'

      # 2. Rename jaeger_duration_bucket to jaeger_duration_milliseconds_bucket
      - source_labels: [__name__]
        regex: 'jaeger_duration_(bucket|count|sum)'
        target_label: __name__
        replacement: 'jaeger_duration_milliseconds_${1}'
