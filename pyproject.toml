[project]
name = "theoros"
version = "0.1.0"
description = """
θεωρός
- spectator, envoy at a festival1
- envoy sent to consult an oracle2

The project we will be using in this book is that of an agentic system for searching for movies, learning about
movies, and other tools regarding movies. I decided to use movies for a few reasons. First of all, the data is not
sensitive. This means that we can focus on learning about using SLMs with agentic applications. That being said, for
many real life use cases, this will not be the case. Another reason is that it does not require special domain
knowledge, since most people are at least acquainted with the movies they like. Finally, it offers a good mix of
different kinds of data, from structured relational data, to free-text of various lengths, to potentially non-text
data. We will focus on text data in this book, but this project can also be grown by you.
"""
requires-python = ">=3.12"
dependencies = [
    "guardrails-ai>=0.10.2",
    "litellm>=1.89.1",
    "llm-guard>=0.1.1",
    "openai>=2.41.1",
    "pydantic-ai-slim[web]>=1.107.0",
    "Wikipedia-API>=0.15.0",
    "scikit-learn>=1.3.2",
    "pandas>=2.1.3",
    "tqdm>=4.66.1",
    "tqdm-joblib>=0.0.5",
]

[tool.uv]
override-dependencies = [
    "click==8.2.0",
]
